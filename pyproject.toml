[project]
name = "cliV1"
version = "1.0.26"
description = "Thisshshss"
authors = [
    { name = "fwifohq", email = "support@kjsjf.org" },
    { name = "ihfei", email = "support@jfkef.org" },
]
maintainers = [
    { name = "aDh", email = "sisiy21208@kingdais.com" },
]
keywords = ["Sjfje", "ierue"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx (>=0.28.1,<1.0.0)",
    "pydantic[email] (>=2.11.0,<3.0.0)",
    "typing-extensions (>=4.13.0,<5.0.0)",
]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
"one" = "https://github.com/WasifMatic/acme-java-sdk"
"vs" = "https://github.com/WasifMatic/acme-java-sdk"

[dependency-groups]
dev = [
    "mypy (>=2.2.0,<3.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
]


[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [{ include = "swagger_petstore_open_api_3_0" }]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "E", "W", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["RUF022"]   # curated, grouped __all__

[tool.mypy]
python_version = "3.10"         # the supported floor, not whichever interpreter is local
files = ["swagger_petstore_open_api_3_0"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "possibly-undefined"]
warn_return_any = true
pretty = true
